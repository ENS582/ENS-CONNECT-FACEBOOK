<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ENS CONNECT - Cloud Fast</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial;background:#f0f2f5;touch-action:manipulation}
.header{background:white;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.logo{font-weight:900;color:#1877f2;font-size:22px;letter-spacing:1px}
.badge{padding:6px 12px;border-radius:12px;color:white;font-weight:900;font-size:11px;display:inline-block}
.badge.on{background:#22c55e;animation:pulse 1s infinite}
.badge.off{background:#f59e0b}
@keyframes pulse{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}
.avatar{width:42px;height:42px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.btn-logout{border:2px solid #ef4444;color:#ef4444;background:white;padding:8px 16px;border-radius:10px;font-weight:900;cursor:pointer;touch-action:manipulation}
.btn-logout:active{transform:scale(.95);background:#fee2e2}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.menu button{border:none;padding:16px 10px;border-radius:16px;color:white;font-weight:900;font-size:14px;cursor:pointer;touch-action:manipulation;transition:transform .1s}
.menu button:active{transform:scale(.92)}
.blue{background:#1877f2}.green{background:#22c55e}.red{background:#ef4444}.black{background:#111}
.cloud-bar{background:#22c55e;color:#dcfce7;text-align:center;padding:8px;font-weight:900;font-size:12px;letter-spacing:.5px}
.stories{display:flex;gap:12px;padding:12px;overflow-x:auto;background:white;white-space:nowrap}
.story-card{min-width:115px;height:175px;border-radius:18px;border:2px dashed #ccc;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#f9fafb;cursor:pointer}
.plus{width:52px;height:52px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.post{background:white;margin:10px;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.input-row{display:flex;gap:10px;align-items:center;padding:12px;background:white;margin:10px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.input-row input{flex:1;background:#f0f2f5;border:none;padding:13px 16px;border-radius:24px;outline:none;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">ENS CONNECT</div>
    <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center">
      <span style="background:#dbeafe;color:#1877f2;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold">amoswairene37@gmail.com</span>
      <span id="cloudBadge" class="badge off">● Connecting Cloud...</span>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="avatar">A</div>
    <button class="btn-logout" onclick="logoutUser()" ontouchstart="logoutUser()">Logout</button>
  </div>
</div>

<div class="menu">
  <button class="blue" onclick="openMessenger()" ontouchstart="openMessenger()">💬 Messenger (<span id="count">1</span>) ☁️ Cloud</button>
  <button class="green" onclick="groupCall()" ontouchstart="groupCall()">📹 Group Call</button>
  <button class="red" onclick="createStory()" ontouchstart="createStory()">➕ Story</button>
  <button class="black" onclick="broadcast()" ontouchstart="broadcast()">📢 Broadcast</button>
</div>

<div id="cloudBar" class="cloud-bar">☁️ CONNECTING CLOUD... Please wait</div>

<div class="stories">
  <div class="story-card" onclick="createStory()" ontouchstart="createStory()"><div class="plus">+</div><b style="margin-top:10px">Create Story</b></div>
  <div class="story-card" style="background:linear-gradient(45deg,#1877f2,#60a5fa);border-style:solid;color:white;font-weight:900">Amos</div>
</div>

<div class="input-row">
  <div class="avatar" style="width:38px;height:38px">A</div>
  <input id="postInput" placeholder="What's on your mind, ENS?" onkeydown="if(event.key==='Enter')addPost()">
  <button onclick="addPost()" ontouchstart="addPost()" style="background:#1877f2;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:900">Post</button>
</div>

<div id="feed"></div>

<div style="padding:14px">
  <div style="background:white
