<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ENS CONNECT - Cloud</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Arial;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f5;touch-action:manipulation}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;padding:20px}
.fb-logo{color:#1877f2;font-size:44px;font-weight:900}
.login-box{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:100%;max-width:400px;margin-top:20px}
.login-box input{width:100%;padding:14px;border:1px solid #dddfe2;border-radius:8px;margin-bottom:12px;font-size:16px}
.btn-login{width:100%;background:#1877f2;color:white;border:none;padding:14px;border-radius:8px;font-weight:900;font-size:18px;touch-action:manipulation}
.btn-login:active{transform:scale(.97)}
.header{background:white;padding:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);position:sticky;top:0;z-index:999}
.logo{font-weight:900;color:#1877f2;font-size:20px}
.badge{padding:6px 12px;border-radius:12px;color:white;font-weight:900;font-size:11px}
.badge.on{background:#22c55e;animation:blink 1.5s infinite}
.badge.off{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.avatar{width:42px;height:42px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.btn-logout{border:2px solid #ef4444;color:#ef4444;background:white;padding:8px 16px;border-radius:10px;font-weight:900;touch-action:manipulation}
.btn-logout:active{background:#fee2e2;transform:scale(.95)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.menu button{border:none;padding:18px;border-radius:16px;color:white;font-weight:900;font-size:14px;touch-action:manipulation}
.menu button:active{transform:scale(.92)}
.blue{background:#1877f2}.green{background:#22c55e}.red{background:#ef4444}.black{background:#111}
.cloud-bar{background:#16a34a;color:white;text-align:center;padding:8px;font-weight:900;font-size:12px}
.post{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.input-row{display:flex;gap:8px;padding:10px;background:white;margin:10px;border-radius:12px}
.input-row input{flex:1;background:#f0f2f5;border:none;padding:12px;border-radius:20px;outline:none}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="fb-logo">ENS CONNECT</div>
  <div class="login-box">
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passInput" type="password" placeholder="Password">
    <button class="btn-login" id="loginBtn">Log in</button>
    <div id="loginStatus" style="text-align:center;margin-top:10px;font-size:11px;color:gray">☁️ Ready - Cloud well connected</div>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="header">
    <div><div class="logo">ENS CONNECT</div><span id="cloudBadge" class="badge off">● Connecting...</span></div>
    <div style="display:flex;gap:8px;align-items:center"><div class="avatar" id="avatarLetter">A</div><button class="btn-logout" id="logoutBtn">Logout</button></div>
  </div>
  <div class="menu">
    <button class="blue" id="btnMsg">💬 Messenger ☁️</button>
    <button class="green" id="btnCall">📹 Group Call</button>
    <button class="red" id="btnStory">➕ Story</button>
    <button class="black" id="btnBroad">📢 Broadcast</button>
  </div>
  <div id="cloudBar" class="cloud-bar">☁️ Connecting to ens-connect-2026 cloud...</div>
  <div class="input-row"><div class="avatar" id="avatar2" style="width:36px;height:36px">A</div><input id="postInput" placeholder="What's on your mind?"><button id="postBtn" style="background:#1877f2;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:900">Post</button></div>
  <div id="feed"></div>
</div>

<script>
// TOUCH + LOGIN LOGIC - WORKS EVEN WITHOUT FIREBASE
function getName(email){
  if(!email) return "User";
  let n=email.split('@')[0].replace(/[._0-9]/g,' ').trim();
  return n.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ') || "User";
}
function checkLogin(){
  const logged=localStorage.getItem('ens_logged_in');
  const email=localStorage.getItem('ens_email')||"";
  if(logged==='true' && email){
    const name=getName(email);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('avatarLetter').textContent=name.charAt(0).toUpperCase();
    document.getElementById('avatar2').textContent=name.charAt(0).toUpperCase();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
}
checkLogin();

function handleLogin(){
  const email=document.getElementById('emailInput').value.trim();
  const pass=document.getElementById('passInput').value.trim();
  if(!email||!pass){ alert('Enter email & password'); return; }
  const btn=document.getElementById('loginBtn');
  btn.textContent='Logging in...';
  btn.disabled=true;
  setTimeout(()=>{
    localStorage.setItem('ens_logged_in','true');
    localStorage.setItem('ens_email',email);
    checkLogin();
    btn.textContent='Log in'; btn.disabled=false;
  },400);
}
document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('loginBtn').addEventListener('touchstart', handleLogin);
document.getElementById('emailInput').addEventListener('keydown', e=>{if(e.key==='Enter') handleLogin();});
document.getElementById('passInput').addEventListener('keydown', e=>{if(e.key==='Enter') handleLogin();});

function handleLogout(){
  if(!confirm('Logout?')) return;
  localStorage.removeItem('ens_logged_in');
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('passInput').value='';
}
document.getElementById('logoutBtn').addEventListener('click', handleLogout);
document.getElementById('logoutBtn').addEventListener('touchstart', handleLogout);

function setupBtn(id, msg){
  const el=document.getElementById(id);
  const fn=()=>alert(msg);
  el.addEventListener('click', fn);
  el.addEventListener('touchstart', fn);
}
setupBtn('btnMsg','💬 Messenger - Cloud ON');
setupBtn('btnCall','📹 Group Call - Cloud ON');
setupBtn('btnStory','➕ Story - Tap Post box');
setupBtn('btnBroad','📢 Broadcast - Cloud ON');
</script>
