<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ENS CONNECT</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Arial}
body{background:#f0f2f5}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.fb-logo{color:#1877f2;font-size:44px;font-weight:900;margin-bottom:20px}
.login-box{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:100%;max-width:400px}
.login-box input{width:100%;padding:14px;border:1px solid #dddfe2;border-radius:8px;margin-bottom:12px;font-size:16px}
#loginBtn{width:100%;background:#1877f2;color:white;border:none;padding:16px;border-radius:8px;font-weight:900;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;z-index:9999}
.header{background:white;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);position:sticky;top:0}
.badge.on{background:#22c55e;color:white;padding:5px 10px;border-radius:12px;font-weight:900;font-size:10px}.badge.off{background:#ef4444;color:white;padding:5px 10px;border-radius:12px;font-weight:900;font-size:10px}
.avatar{width:40px;height:40px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.avatar img,.profile-pic img{width:100%;height:100%;object-fit:cover}
.fb-profile{background:white;margin-bottom:10px}
.cover{height:140px;background:linear-gradient(135deg,#1877f2,#42b72a);position:relative}
.profile-pic{width:110px;height:110px;border-radius:50%;border:5px solid white;background:#1877f2;color:white;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;position:absolute;bottom:-55px;left:50%;transform:translateX(-50%);overflow:hidden;cursor:pointer}
.profile-info{text-align:center;padding:65px 10px 15px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:white}
.menu button{border:none;padding:14px;border-radius:12px;color:white;font-weight:900;cursor:pointer}
.blue{background:#1877f2}.green{background:#22c55e}.red{background:#ef4444}.black{background:#111}
.cloud-bar.on{background:#16a34a;color:white;text-align:center;padding:7px;font-weight:900;font-size:11px}.cloud-bar.off{background:#ef4444;color:white;text-align:center;padding:7px;font-weight:900;font-size:11px}
.post{background:white;margin:8px;border-radius:12px;padding:12px}
.input-row{display:flex;gap:8px;padding:10px;background:white;margin:8px;border-radius:12px}
.input-row input{flex:1;background:#f0f2f5;border:none;padding:11px;border-radius:20px;outline:none}
.hidden{display:none!important}
.messenger-window{position:fixed;bottom:0;left:0;right:0;height:85vh;background:white;z-index:9999;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:.3s}
.messenger-window.open{transform:translateY(0)}
.msg-header{background:#1877f2;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;border-radius:20px 20px 0 0}
.msg-list{flex:1;overflow-y:auto;padding:10px;background:#f0f2f5}
.msg-bubble{max-width:75%;padding:10px;border-radius:18px;margin:6px 0}
.msg-me{background:#1877f2;color:white;margin-left:auto}.msg-other{background:white;margin-right:auto}
.msg-input-row{display:flex;gap:8px;padding:10px;background:white;border-top:1px solid #ddd}
.msg-input-row input{flex:1;padding:12px;border-radius:20px;border:none;background:#f0f2f5}
.call-window{position:fixed;inset:0;background:#111;z-index:10000;display:flex;flex-direction:column;transform:translateY(100%);transition:.3s}
.call-window.open{transform:translateY(0)}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;padding:6px;overflow:auto;background:#000}
.video-grid video{width:100%;height:160px;background:#222;border-radius:12px;object-fit:cover}
.call-controls{display:flex;justify-content:center;gap:12px;padding:14px;background:#000}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;font-size:22px}
.call-end{background:#ef4444;color:white}.call-mic,.call-cam{background:#333;color:white}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="fb-logo">ENS CONNECT</div>
  <div class="login-box">
    <input id="emailInput" type="email" placeholder="Email" value="amoswairene37@gmail.com">
    <input id="passInput" type="password" placeholder="Password" value="">
    <!-- TRIPLE TOUCH FIX -->
    <button id="loginBtn" type="button" onclick="doLogin()" ontouchstart="doLogin()" >Log in - TAP HERE</button>
    <div style="text-align:center;margin-top:12px"><a href="#" onclick="doLogin();return false" style="color:#1877f2;font-weight:900">If button not touching, TAP THIS LINK</a></div>
    <div style="text-align:center;margin-top:8px;font-size:11px;color:#22c55e">✅ Triple Touch Fixed</div>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="header">
    <div style="display:flex;align-items:center;gap:8px"><b style="color:#1877f2">ENS CONNECT</b><span id="cloudBadge" class="badge off">● Connecting...</span></div>
    <div style="display:flex;gap:8px;align-items:center"><div class="avatar" id="avatarSmall">A</div><button type="button" onclick="doLogout()" style="border:2px solid #ef4444;color:#ef4444;background:white;padding:6px 12px;border-radius:8px;font-weight:900">Logout</button></div>
  </div>
  <div class="fb-profile"><div class="cover"><div class="profile-pic" id="profilePic" onclick="document.getElementById('photoInput').click()">A</div></div><div class="profile-info"><h2 id="profileName">User</h2><p id="profileSub">Welcome</p><p><button onclick="document.getElementById('photoInput').click()" style="background:#e7f3ff;color:#1877f2;border:none;padding:6px 14px;border-radius:20px;font-weight:900;margin-top:8px">📷 Change Photo</button></p></div></div>
  <div class="menu">
    <button class="blue" onclick="document.getElementById('messengerWindow').classList.add('open')">💬 Messenger</button>
    <button class="green" onclick="startGroupCall()">📹 Group Call</button>
    <button class="red" onclick="document.getElementById('postInput').focus()">➕ Story</button>
    <button class="black" onclick="alert('Broadcast ON')">📢 Broadcast</button>
  </div>
  <div id="cloudBar" class="cloud-bar off">☁️ Connecting...</div>
  <div class="input-row"><div class="avatar" id="avatar2">A</div><input id="postInput" placeholder="What's on your mind?"><button onclick="doPost()" style="background:#1877f2;color:white;border:none;padding:10px 14px;border-radius:20px;font-weight:900">Post</button></div>
  <div id="feed"></div>
</div>

<div id="messengerWindow" class="messenger-window">
  <div class="msg-header"><div><b>💬 Messenger</b></div><button onclick="document.getElementById('messengerWindow').classList.remove('open')" style="background:white;color:#1877f2;border:none;width:30px;height:30px;border-radius:50%">X</button></div>
  <div id="msgList" class="msg-list"></div>
  <div class="msg-input-row"><input id="msgInput" placeholder="Type..."><button onclick="sendMsg()" style="background:#1877f2;color:white;border:none;padding:12px 16px;border-radius:20px">Send</button></div>
</div>
<div id="callWindow" class="call-window">
  <div style="background:#1877f2;color:white;padding:12px;display:flex;justify-content:space-between"><b>📹 Call • <span id="callCount">0</span> joined</b><button onclick="leaveCall()" style="background:white;color:#ef4444;border:none;padding:6px 12px;border-radius:20px">Leave</button></div>
  <div id="videoGrid" class="video-grid"></div>
  <div class="call-controls"><button id="micBtn" class="call-btn call-mic" onclick="toggleMic()">🎤</button><button id="camBtn" class="call-btn call-cam" onclick="toggleCam()">📹</button><button class="call-btn call-end" onclick="leaveCall()">☎️</button></div>
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none">
<audio id="msgSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c8f5b2.mp3"></audio>

<script>
// ===== ULTRA TOUCH FIX - WORKS IN FACEBOOK BROWSER =====
function getName(e){if(!e)return"User";let n=e.split('@')[0].replace(/[._0-9]/g,' ').trim();return n.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')||"User";}
function setPhoto(b64){
  document.getElementById('profilePic').innerHTML=`<img src="${b64}">`;
  document.getElementById('avatarSmall').innerHTML=`<img src="${b64}">`;
  document.getElementById('avatar2').innerHTML=`<img src="${b64}">`;
}
function checkLogin(){
  const l=localStorage.getItem('ens_logged_in'), em=localStorage.getItem('ens_email')||"";
  if(l==='true'&&em){
    const name=getName(em);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('profileName').textContent=name;
    document.getElementById('profileSub').textContent='Welcome, '+name;
    const ph=localStorage.getItem('ens_photo_'+em);
    if(ph) setPhoto(ph); else {
      document.getElementById('profilePic').textContent=name[0];
      document.getElementById('avatarSmall').textContent=name[0];
      document.getElementById('avatar2').textContent=name[0];
    }
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
}
function doLogin(){
  console.log('Login tapped!');
  const email=document.getElementById('emailInput').value.trim();
  const pass=document.getElementById('passInput').value.trim();
  if(!email){alert('Enter email');return;}
  if(!pass){alert('Enter password');return;}
  localStorage.setItem('ens_logged_in','true');
  localStorage.setItem('ens_email',email);
  checkLogin();
  // vibrate feedback
  try{navigator.vibrate(100);}catch(e){}
}
// Attach multiple listeners for Facebook browser
document.addEventListener('DOMContentLoaded', function(){
  checkLogin();
  const btn=document.getElementById('loginBtn');
  if(btn){
    btn.addEventListener('touchstart', function(e){ e.preventDefault(); doLogin(); }, {passive:false});
    btn.addEventListener('click', doLogin);
    btn.addEventListener('touchend', function(e){ e.preventDefault(); doLogin(); }, {passive:false});
  }
});
checkLogin();
function doLogout(){localStorage.removeItem('ens_logged_in');checkLogin();}
document.getElementById('photoInput').onchange=function(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=function(ev){
    const b64=ev.target.result; const em=localStorage.getItem('ens_email')||'anon';
    localStorage.setItem('ens_photo_'+em,b64); setPhoto(b64);
    try{firebase.database().ref('ens_profiles/'+em.replace(/[^a-zA-Z0-9]/g,'_')).set({email:em,photo:b64,time:Date.now()});}catch(err){}
  }; r.readAsDataURL(f);
};
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB19__OdQ6gHWW-Wmari2jMVZfa-P5qe0E",
  authDomain: "ens-connect-2026-e563b.firebaseapp.com",
  databaseURL: "https://ens-connect-2026-e563b-default-rtdb.firebaseio.com",
  projectId: "ens-connect-2026-e563b",
  storageBucket: "ens-connect-2026-e563b.firebasestorage.app",
  messagingSenderId: "382030495866",
  appId: "1:382030495866:web:5c42bf76bff50623ed3bc3",
  measurementId: "G-8YGL4R38LD"
};
try{
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
db.ref('.info/connected').on('value',s=>{
  const b=document.getElementById('cloudBadge'),bar=document.getElementById('cloudBar');
  if(s.val()===true){if(b){b.textContent='● Cloud Sync ON';b.className='badge on';}if(bar){bar.textContent='☁️ CLOUD ON • Sync OK • Touch OK';bar.className='cloud-bar on';}}
});
const postsRef=db.ref('ens_posts');
postsRef.limitToLast(50).on('child_added',s=>{
  const d=s.val(); if(!d) return; const f=document.getElementById('feed');
  const el=document.createElement('div'); el.className='post'; el.innerHTML=`<b>${getName(d.email)}</b> <small style="color:#22c55e">☁️</small><br>${d.text}<br><small style="color:gray">${new Date(d.time).toLocaleString()}</small>`; f.prepend(el);
});
window.doPost=function(){const i=document.getElementById('postInput');const t=i.value.trim();if(!t)return;postsRef.push({text:t,email:localStorage.getItem('ens_email')||'anon',time:Date.now()});i.value='';};
const chatRef=db.ref('ens_messenger_chats');
chatRef.limitToLast(100).on('child_added',s=>{
  const m=s.val(),id=s.key; if(!m)return; const my=localStorage.getItem('ens_email')||''; const isMe=m.email===my;
  const l=document.getElementById('msgList'); const div=document.createElement('div'); div.className='msg-bubble '+(isMe?'msg-me':'msg-other'); div.id='msg-'+id;
  div.innerHTML=`${!isMe?`<small style="color:#1877f2;font-weight:900">${getName(m.email)}</small><br>` : ''}${m.text}`;
  l.appendChild(div); l.scrollTop=l.scrollHeight;
});
window.sendMsg=function(){const i=document.getElementById('msgInput');const t=i.value.trim();if(!t)return;chatRef.push({text:t,email:localStorage.getItem('ens_email')||'anon',time:Date.now()});i.value='';};
const callRef=db.ref('ens_group_call'); let localStream,inCall=false,micOn=true,camOn=true;
window.startGroupCall=async()=>{
  document.getElementById('callWindow').classList.add('open');
  try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); const em=localStorage.getItem('ens_email')||'anon'; const id=em.replace(/[^a-zA-Z0-9]/g,'_'); const g=document.getElementById('videoGrid'); g.innerHTML=''; const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=true; v.srcObject=localStream; g.appendChild(v); callRef.child(id).set({email:em,joined:Date.now()}); callRef.child(id).onDisconnect().remove(); inCall=true;}catch(e){alert('Allow camera in Chrome: '+e.message);}
};
window.leaveCall=()=>{document.getElementById('callWindow').classList.remove('open'); if(localStream)localStream.getTracks().forEach(t=>t.stop()); const em=localStorage.getItem('ens_email')||'anon'; callRef.child(em.replace(/[^a-zA-Z0-9]/g,'_')).remove(); document.getElementById('videoGrid').innerHTML=''; inCall=false;};
window.toggleMic=()=>{micOn=!micOn; if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=micOn);};
window.toggleCam=()=>{camOn=!camOn; if(localStream)localStream.getVideoTracks().forEach(t=>t.enabled=camOn);};
}catch(e){console.log(e);}
</script>
</body>
    </html>
