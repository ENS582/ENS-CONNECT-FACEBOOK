<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ENS CONNECT</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Arial;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f5;touch-action:manipulation}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;padding:20px}
.fb-logo{color:#1877f2;font-size:44px;font-weight:900}
.login-box{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:100%;max-width:400px;margin-top:20px}
.login-box input{width:100%;padding:14px;border:1px solid #dddfe2;border-radius:8px;margin-bottom:12px;font-size:16px}
.btn-login{width:100%;background:#1877f2;color:white;border:none;padding:14px;border-radius:8px;font-weight:900;font-size:18px;touch-action:manipulation}
.btn-login:active{transform:scale(.97)}
.header{background:white;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);position:sticky;top:0;z-index:999}
.logo{font-weight:900;color:#1877f2;font-size:20px}
.badge{padding:5px 10px;border-radius:12px;color:white;font-weight:900;font-size:10px}
.badge.on{background:#22c55e;animation:blink 1s infinite}.badge.off{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.avatar{width:40px;height:40px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.btn-logout{border:2px solid #ef4444;color:#ef4444;background:white;padding:7px 14px;border-radius:8px;font-weight:900;font-size:12px;touch-action:manipulation}
.btn-logout:active{transform:scale(.93)}
.fb-profile{background:white;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.cover{height:150px;background:linear-gradient(135deg,#1877f2,#42b72a);position:relative}
.profile-pic{width:110px;height:110px;border-radius:50%;border:5px solid white;background:#1877f2;color:white;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;position:absolute;bottom:-55px;left:50%;transform:translateX(-50%)}
.profile-info{text-align:center;padding:65px 10px 15px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:white}
.menu button{border:none;padding:14px;border-radius:12px;color:white;font-weight:900;font-size:13px;touch-action:manipulation}
.menu button:active{transform:scale(.93)}
.blue{background:#1877f2}.green{background:#22c55e}.red{background:#ef4444}.black{background:#111}
.cloud-bar{color:white;text-align:center;padding:7px;font-weight:900;font-size:11px}
.cloud-bar.on{background:#16a34a}.cloud-bar.off{background:#ef4444}
.post{background:white;margin:8px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.input-row{display:flex;gap:8px;padding:10px;background:white;margin:8px;border-radius:12px}
.input-row input{flex:1;background:#f0f2f5;border:none;padding:11px;border-radius:20px;outline:none}
.hidden{display:none!important}
.messenger-window{position:fixed;bottom:0;left:0;right:0;height:85vh;background:white;z-index:9999;border-radius:20px 20px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateY(100%);transition:.3s}
.messenger-window.open{transform:translateY(0)}
.msg-header{background:#1877f2;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:20px 20px 0 0}
.msg-list{flex:1;overflow-y:auto;padding:10px;background:#f0f2f5}
.msg-bubble{max-width:75%;padding:10px 12px;border-radius:18px;margin:6px 0;position:relative;word-break:break-word;touch-action:manipulation}
.msg-bubble:active{transform:scale(.97)}
.msg-me{background:#1877f2;color:white;margin-left:auto;border-bottom-right-radius:4px}
.msg-other{background:white;margin-right:auto;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.msg-input-row{display:flex;gap:8px;padding:10px;background:white;border-top:1px solid #ddd}
.msg-input-row input{flex:1;padding:12px;border-radius:20px;border:none;background:#f0f2f5;outline:none}
.delete-btn{position:absolute;top:-8px;right:-8px;background:#ef4444;color:white;border:none;border-radius:50%;width:22px;height:22px;font-weight:900}
</style>
<!-- FIREBASE CODE - WELL CONNECTED -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="fb-logo">ENS CONNECT</div>
  <div class="login-box">
    <input id="emailInput" type="email" placeholder="Email address">
    <input id="passInput" type="password" placeholder="Password">
    <button class="btn-login" id="loginBtn">Log in</button>
    <div id="loginStatus" style="text-align:center;margin-top:10px;font-size:11px;color:#22c55e">
