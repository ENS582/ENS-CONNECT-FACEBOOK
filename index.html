<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENS CONNECT</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Arial}
body{background:#f0f2f5}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;padding:20px}
.fb-logo{color:#1877f2;font-size:48px;font-weight:900;letter-spacing:-1px;margin-bottom:10px}
.fb-tag{font-size:18px;margin-bottom:30px;text-align:center}
.login-box{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:100%;max-width:400px}
.login-box input{width:100%;padding:14px;border:1px solid #dddfe2;border-radius:8px;margin-bottom:12px;font-size:16px;outline:none}
.login-box input:focus{border-color:#1877f2}
.btn-login{width:100%;background:#1877f2;color:white;border:none;padding:14px;border-radius:8px;font-weight:900;font-size:18px;cursor:pointer}
.btn-login:active{transform:scale(.98)}
.forgot{text-align:center;margin-top:15px;color:#1877f2;font-size:14px}
.divider{border-top:1px solid #dddfe2;margin:20px 0}
.btn-create{width:60%;margin:0 auto;display:block;background:#42b72a;color:white;border:none;padding:12px;border-radius:8px;font-weight:900}
.header{background:white;padding:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);position:sticky;top:0;z-index:999}
.logo{font-weight:900;color:#1877f2;font-size:22px}
.badge{padding:6px 12px;border-radius:12px;color:white;font-weight:900;font-size:11px}
.badge.on{background:#22c55e}.badge.off{background:#f59e0b}
.avatar{width:42px;height:42px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.btn-logout{border:2px solid #ef4444;color:#ef4444;background:white;padding:8px 16px;border-radius:10px;font-weight:900}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.menu button{border:none;padding:16px;border-radius:16px;color:white;font-weight:900;font-size:14px}
.blue{background:#1877f2}.green{background:#22c55e}.red{background:#ef4444}.black{background:#111}
.cloud-bar{background:#16a34a;color:white;text-align:center;padding:8px;font-weight:900;font-size:12px}
.post{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- FACEBOOK STYLE LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="fb-logo">ENS CONNECT</div>
  <div class="fb-tag">Connect with friends and the world<br>around you on ENS.</div>
  <div class="login-box">
    <input id="emailInput" type="email" placeholder="Email address or phone number" value="amoswairene37@gmail.com">
    <input id="passInput" type="password" placeholder="Password">
    <button class="btn-login" id="loginBtn">Log in</button>
    <div class="forgot">Forgotten password?</div>
    <div class="divider"></div>
    <button class="btn-create" onclick="alert('Create account - Contact Admin')">Create new account</button>
    <div style="text-align:center;margin-top:20px;font-size:12px;color:#666">☁️ Cloud Sync • Fast • Secure</div>
  </div>
</div>

<!-- MAIN APP - HIDDEN UNTIL LOGIN -->
<div id="mainApp" class="hidden">
  <div class="header">
    <div>
      <div class="logo">ENS CONNECT</div>
      <div style="display:flex;gap:6px;margin-top:5px">
        <span id="cloudBadge" class="badge off">● Connecting Cloud...</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="avatar">A</div>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="menu">
    <button class="blue" id="btnMsg">💬 Messenger (1) ☁️ Cloud</button>
    <button class="green" id="btnCall">📹 Group Call</button>
    <button class="red" id="btnStory">➕ Story</button>
    <button class="black" id="btnBroad">📢 Broadcast</button>
  </div>
  <div id="cloudBar" class="cloud-bar">☁️ CLOUD CONNECTING...</div>
  <div id="feed" style="padding:10px"></div>
</div>

<script>
// CHECK IF LOGGED IN
function checkLogin(){
  const logged = localStorage.getItem('ens_logged_in');
  if(logged === 'true'){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    setTimeout(()=>{
      document.getElementById('cloudBadge').textContent='● Cloud Sync ON - Fast!';
      document.getElementById('cloudBadge').className='badge on';
      document.getElementById('cloudBar').textContent='☁️ CLOUD ON • Fast sync • Real-time • 1/20 members';
      document.getElementById('feed').innerHTML='<div class="post" style="border-left:5px solid #22c55e;background:#f0fdf4"><b>☁️ Welcome back Amos!</b><br>Cloud connected - All buttons touching!</div>';
    },800);
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
}
checkLogin();

// LOGIN BUTTON - FACEBOOK STYLE
document.getElementById('loginBtn').addEventListener('click', function(){
  const email = document.getElementById('emailInput').value;
  const pass = document.getElementById('passInput').value;
  if(!email || !pass){ alert('Enter email and password'); return; }
  this.textContent='Logging in...';
  setTimeout(()=>{
    localStorage.setItem('ens_logged_in','true');
    localStorage.setItem('ens_email', email);
    checkLogin();
    this.textContent='Log in';
  },1000);
});

// LOGOUT - SHOW FACEBOOK LOGIN SCREEN AGAIN
document.getElementById('logoutBtn').addEventListener('click', function(){
  if(confirm('Logout from ENS CONNECT?')){
    localStorage.removeItem('ens_logged_in');
    try{indexedDB.deleteDatabase('firebaseLocalStorageDb');}catch(e){}
    // Show Facebook style login again
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('passInput').value='';
    alert('✅ Logged out! Login again like Facebook');
  }
});

document.getElementById('btnMsg').addEventListener('click', ()=>alert('💬 Messenger Cloud - 1 member'));
document.getElementById('btnCall').addEventListener('click', ()=>alert('📹 Group Call ready'));
document.getElementById('btnStory').addEventListener('click', ()=>{let t=prompt('Story text:'); if(t){let d=document.createElement('div'); d.className='post'; d.innerHTML='<b>Amos</b><br>'+t; document.getElementById('feed').prepend(d);}});
document.getElementById('btnBroad').addEventListener('click', ()=>alert('📢 Broadcast'));
</script>
