.story-card{min-width:110px;height:170px;border-radius:16px;border:2px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f9fafb}
.story-card.live{border:3px solid #1877f2;border-style:solid}
.plus{width:50px;height:50px;background:#1877f2;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.post{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.input-row{display:flex;gap:10px;align-items:center;padding:10px;background:white;margin:10px;border-radius:12px}
