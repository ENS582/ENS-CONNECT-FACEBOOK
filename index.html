<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENS CONNECT - Simple</title>
<style>
body{margin:0;background:#0084ff;font-family:sans-serif}
.box{background:#fff;margin:20px auto;max-width:380px;border-radius:16px;padding:20px}
input{width:100%;padding:16px;border:1px solid #ccc;border-radius:10px;margin:10px 0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:18px;border:0;border-radius:10px;font-size:18px;font-weight:900;color:#fff;cursor:pointer;margin:8px 0}
.blue{background:#0066ff}.green{background:#00aa00}
button:active{opacity:0.7}
</style></head><body>
<div class="box">
<h2 style="text-align:center;color:#0066ff;margin:0">ensCONNECT</h2>
<p style="text-align:center;font-size:13px">MAX 20 • Individual Email • SIMPLE TOUCH FIX</p>

<input id="e" type="email" placeholder="Email: amoswairene37@gmail.com" value="amoswairene37@gmail.com">
<input id="p" type="password" placeholder="Password: 123456" value="123456">

<button class="blue" onclick="go()">LOG IN - TAP ME</button>

<button class="green" onclick="add()">+ ADD MEMBER - TAP ME</button>

<p style="font-size:12px;background:#eef;padding:10px;border-radius:8px">
<b>If this button touches, old cache was problem!</b><br>
Current time: <span id="time"></span><br>
<span id="status">JS Working: YES ✓</span>
</p>

<div id="list" style="font-size:12px;margin-top:10px"></div>

<p style="text-align:center"><a href="#" onclick="localStorage.clear();location.reload();return false" style="color:red">Clear Data & Reload</a></p>
</div>

<script>
document.getElementById('time').innerText=new Date().toLocaleString();
// SIMPLE STORAGE - NO CACHE
let users=[];
try{ users=JSON.parse(localStorage.getItem('users20')||'[]'); }catch(e){ users=[]; }
if(users.length==0){ users=[{name:'Amos',email:'amoswairene37@gmail.com',pass:'123456'}]; localStorage.setItem('users20',JSON.stringify(users)); }
document.getElementById('list').innerHTML='Members: '+users.length+'/20<br>'+users.map(u=>u.email).join('<br>');

function go(){
 let e=document.getElementById('e').value.toLowerCase().trim();
 let p=document.getElementById('p').value.trim();
 if(!e) return alert('Enter email');
 let u=users.find(x=>x.email==e);
 if(!u) return alert('Email not found. Tap ADD MEMBER first. Found: '+users.map(x=>x.email).join(', '));
 if(u.pass!=p) return alert('Wrong password. Correct is: '+u.pass);
 alert('SUCCESS! Logged in as '+u.name+'\n\nNow I will load full Facebook with Stories + Group Call + Messenger');
 localStorage.setItem('current',JSON.stringify(u));
 // load full app after login success
 document.body.innerHTML='<h1 style="color:#fff;text-align:center;padding:50px">✅ LOGIN OK! Loading full app...</h1>';
 setTimeout(()=>{ location.href='https://ens582.github.io/ENS-CONNECT-FACEBOOK/?v=full&user='+encodeURIComponent(e); },1000);
}
function add(){
 let n=prompt('Full Name:'); if(!n) return;
 let e=prompt('Individual Email:'); if(!e) return; e=e.toLowerCase();
 let pa=prompt('Password:'); if(!pa) return;
 if(users.length>=20) return alert('Max 20 reached');
 if(users.find(x=>x.email==e)) return alert('Email exists');
 users.push({name:n,email:e,pass:pa});
 localStorage.setItem('users20',JSON.stringify(users));
 alert('Added! Now '+users.length+'/20');
 location.reload();
}
</script>
</body></html>
